name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the checked wheels branch after both candidate reviews'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  ci-verification:
    if: github.repository == 'wheels-dev/LuCLI'
    name: CI Verification
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write

  publish:
    needs: ci-verification
    if: github.repository == 'wheels-dev/LuCLI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-21-${{ hashFiles('**/pom.xml') }}
      - name: Validate unpublished fork version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/wheels ]]; then
            echo 'Publishing is allowed only from wheels'; exit 1
          fi
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected upstream.patch-counter version'; exit 1; }
          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; never replace a published version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mvn -DskipTests=true clean package -Pwindows-exe
          mkdir dist
          cat src/bin/lucli.sh target/lucli.jar > "dist/lucli-$VERSION-linux"
          chmod +x "dist/lucli-$VERSION-linux"
          cp "dist/lucli-$VERSION-linux" "dist/lucli-$VERSION-macos"
          cp target/lucli.jar "dist/lucli-$VERSION.jar"
          cp target/lucli.jar dist/lucli.jar
          cp target/lucli.exe "target/lucli-$VERSION.exe"
          cp "target/lucli-$VERSION.exe" dist/
          cp "dist/lucli-$VERSION-linux" dist/lucli
          zip -j target/lucli-windows.zip target/lucli.exe
          cp target/lucli-windows.zip dist/
          java -jar "dist/lucli-$VERSION.jar" --version | tee /tmp/lucli-version.txt
          grep -F "LuCLI Version: $VERSION" /tmp/lucli-version.txt
          (cd dist && sha256sum * > checksums_sha256.txt)
      - name: Retain candidate assets without publishing
        uses: actions/upload-artifact@v4
        with:
          name: lucli-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          retention-days: 14
      - name: Publish only to the Wheels fork
        if: inputs.publish && github.ref == 'refs/heads/wheels'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* \
            --repo wheels-dev/LuCLI --target "$GITHUB_SHA" --latest \
            --title "LuCLI $VERSION (Wheels patch queue)" \
            --notes 'Shipped fork v0.6.2 plus the reviewed Wheels patch queue. See FORK.md at this tag for provenance, verification, and known limits.'
